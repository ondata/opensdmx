name: Substack feed reachability test

# Test usa e getta: da un runner GitHub, quali endpoint Substack rispondono?
#   1. /feed              -> atteso 403 (Cloudflare challenge sugli IP datacenter)
#   2. /api/v1/archive    -> da verificare: stessa regola o path meno protetto?
#   3. gli stessi via r.jina.ai (senza API key: rate limit basso ma sufficiente)

on:
  push:
    branches:
      - test/substack-feed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Direct probes
        run: |
          set +e
          probe () {
            echo "=============================================="
            echo ">>> $1"
            curl -sSL --max-time 30 -D /tmp/h -o /tmp/b \
                 -w '>>> RESULT: http=%{http_code} type=%{content_type}\n' "$1"
            grep -iE '^(HTTP/|cf-mitigated|cf-ray|server):' /tmp/h
            echo ">>> primi 200 byte:"; head -c 200 /tmp/b; echo
          }
          probe "https://ondata.substack.com/feed"
          probe "https://ondata.substack.com/api/v1/archive?sort=new&limit=5"
          probe "https://ondata.substack.com/archive"
          echo "=============================================="
          echo ">>> IP pubblico del runner:"; curl -sS --max-time 15 https://api.ipify.org; echo

      - name: Same endpoints through r.jina.ai (no API key)
        run: |
          set +e
          for target in "https://ondata.substack.com/feed" \
                        "https://ondata.substack.com/api/v1/archive?sort=new&limit=5"; do
            echo "=============================================="
            echo ">>> r.jina.ai -> $target"
            curl -sS --max-time 60 -H "Accept: application/json" -H "X-No-Cache: true" \
                 -w '\n>>> RESULT: http=%{http_code}\n' \
                 "https://r.jina.ai/$target" -o /tmp/j
            head -c 300 /tmp/j; echo
          done
