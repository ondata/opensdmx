name: Descriptions Archive

on:
  schedule:
    # 03:40 UTC on the 1st of each month — descriptions are quasi-static, so a
    # monthly refresh is ample. Odd minute on purpose: round times queue longer.
    - cron: '40 3 1 * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to harvest (default: istat)'
        required: false
        default: 'istat'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Restore opensdmx cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/opensdmx
          key: descriptions-archive-${{ github.run_id }}
          restore-keys: descriptions-archive-

      - name: Install dependencies
        run: uv sync

      - name: Harvest descriptions
        continue-on-error: true
        run: uv run python scripts/descriptions_archive.py --provider "${{ inputs.provider || 'istat' }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/opensdmx/data/descriptions/
          if git diff --staged --quiet; then
            echo "No description changes to commit"
            exit 0
          fi
          git commit -m "data: descriptions archive $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
